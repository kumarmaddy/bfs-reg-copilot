# Local PostgreSQL with pgvector (ADR-0004, ADR-0015). A throwaway learning database:
# loopback only, no real data, no secrets. Start: docker compose up -d
services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: bfs-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bfs
      POSTGRES_PASSWORD: ${BFS_PG_PASSWORD:-bfs_dev}
      POSTGRES_DB: bfs
    ports:
      - "127.0.0.1:5433:5432" # loopback only; 5433 avoids clashing with a local Postgres
    volumes:
      - bfs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bfs -d bfs"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  bfs_pgdata:

  source: A-OSFI-B13
  type: lookup
  difficulty: medium
  question: How should disaster recovery capabilities be tested under B-13?
  key_points:
  - Regularly validate and report on strategies, plans and capabilities against severe but plausible scenarios
  - 'Scenarios should be forward-looking: emerging threats, material changes, prolonged outages, past

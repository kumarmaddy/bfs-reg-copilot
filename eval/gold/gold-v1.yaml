- id: G-B13-002
  kind: answerable
  split: dev
  source: A-OSFI-B13
  type: lookup
  difficulty: medium
  question: What should an enterprise disaster recovery program (EDRP) establish under B-13?
  key_points:
  - Accountability and responsibility for availability and recovery of technology services
  - A process to identify and analyse technology services and key dependencies
  - Plans and capabilities to recover services to an acceptable level within an acceptable timeframe
  - A policy or standard for data back-up and recovery, including storage and periodic testing
  pass_rule:
    min_points: 3
    required_points: []
    text: 3 of 4
  supporting_chunks:
  - A-OSFI-B13:9a80bc98e618:s047:c000

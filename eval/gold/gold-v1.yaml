- id: G-E21-004
  kind: answerable
  split: dev
  source: A-OSFI-E21
  type: lookup
  difficulty: medium
  question: What should a business continuity plan include under E-21?
  key_points:
  - Protocols for invoking the plan and making decisions
  - Roles and responsibilities for managing disruptions
  - Backup personnel for unexpected absences
  - Precautions to ensure staff safety
  - Targets for recovery levels and times
  - Impact analysis, workarounds and recovery strategies
  - Internal and external communication plans

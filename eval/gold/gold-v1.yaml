  source: A-OSFI-B13
  type: lookup
  difficulty: easy
  question: Who does B-13 say should hold responsibility for technology and cyber risk governance?
  key_points:
  - Senior management is accountable and should assign clear responsibility to senior officers
  - 'Example roles: head of IT, CTO, CIO, head of cyber security or CISO'
  - These roles should have appropriate stature and visibility in the institution
  pass_rule:
    min_points: 2
    required_points: []
    text: 2 of 3
  supporting_chunks:

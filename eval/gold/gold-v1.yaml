  - Least privilege, regular attestation of access and strong passwords
  - MFA across external-facing channels and privileged accounts
  - Privileged credentials held in a secure vault
  - Logging and monitoring account activity
  - Securely authenticating, managing and monitoring service accounts
  pass_rule:

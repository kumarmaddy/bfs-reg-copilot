  - A-OSFI-E21:ae9cb76a7e26:s032:c000
  - A-OSFI-E21:ae9cb76a7e26:s035:c000
  - A-OSFI-E21:ae9cb76a7e26:s036:c000
  - A-OSFI-E21:ae9cb76a7e26:s037:c000
  note: The list is not exhaustive, per the text.
- id: G-B10-001
  kind: answerable
  split: dev
  source: A-OSFI-B10
  type: definition
  difficulty: medium
  question: What counts as a "third-party arrangement" under B-10, and what is excluded?
  key_points:
  - Any business or strategic arrangement between the institution and an entity or individual, by contract
    or otherwise
  - 'Excluded: arrangements with the institution''s customers (such as depositors and policyholders) and
    employment contracts'
  - Examples include outsourced services, consultants, brokers, utilities, financial market infrastructures,
    affiliate services and cloud or managed service providers (at least three)
  pass_rule:
    min_points: 3
    required_points: []
    text: all
  supporting_chunks:
  - A-OSFI-B10:250d83cc8521:s004:c001
  - A-OSFI-B10:250d83cc8521:s004:c002
  note: ''
- id: G-B10-002
  kind: answerable
  split: dev
  source: A-OSFI-B10
  type: comparison
  difficulty: medium
  question: What are the two forms of concentration risk in B-10?
  key_points:
  - 'Institution-specific: the institution suffers loss or harm because it leans too heavily on one third
    party, subcontractor or location for several activities'
  - 'Systemic: many institutions depend on the same third party or location for their services, so one
    failure spreads across them'
  pass_rule:
    min_points: 2
    required_points: []
    text: all
  supporting_chunks:
  - A-OSFI-B10:250d83cc8521:s004:c000
  note: s023 adds that institutions should assess concentration by geography, supplier and subcontractor.
- id: G-B10-003
  kind: answerable
  split: dev
  source: A-OSFI-B10
  type: lookup
  difficulty: medium
  question: What should an institution consider when judging how critical a third-party arrangement is?
  key_points:
  - Severity of loss or harm if the third party or a subcontractor fails to meet expectations
  - Substitutability, including portability and timeliness of transferring the service
  - How far the third party supports a critical operation
  - Impact on operations if the institution had to exit and move to another provider or bring the work
    in-house
  pass_rule:
    min_points: 3
    required_points: []
    text: 3 of 4
  supporting_chunks:
  - A-OSFI-B10:250d83cc8521:s014:c000
  note: ''
- id: G-B10-004
  kind: answerable
  split: dev
  source: A-OSFI-B10
  type: lookup
  difficulty: medium
  question: What should contingency and exit plans for high-risk or critical third-party arrangements
    include?
  key_points:
  - Triggers for invoking the plan
  - A playbook for stressed exit (failure or insolvency of the provider)
  - A playbook for planned, non-stressed exit
  - Reference to contract provisions affecting exit, such as notice and continued service periods
  - Enough detail for rapid execution (alternatives, timelines, costs, workarounds)
  - Plans for severe but plausible scenarios, including prolonged and multiple disruptions
  pass_rule:
    min_points: 5
    required_points: []
    text: 5 of 6
  supporting_chunks:
  - A-OSFI-B10:250d83cc8521:s040:c000
  note: Plans are reviewed regularly and more often after material changes.
- id: G-B10-005
  kind: answerable
  split: holdout
  source: A-OSFI-B10
  type: multi-hop
  difficulty: hard
  question: What does B-10 expect regarding incidents at a third party?
  key_points:
  - Third parties have defined processes to identify, investigate, escalate, remediate and notify the
    institution of incidents, including subcontractor incidents
  - Written agreements enable compliance with OSFI's Technology and Cyber Security Incident Reporting
    Advisory, for example prompt notification of incidents
  - The institution has internal processes, with accountabilities and escalation triggers, to manage third-party
    incidents and track remediation
  - The institution asks the third party for root cause analysis, does its own as appropriate, and monitors
    remediation
  pass_rule:
    min_points: 3
    required_points: []
    text: 3 of 4
  supporting_chunks:
  - A-OSFI-B10:250d83cc8521:s045:c000
  - A-OSFI-B10:250d83cc8521:s046:c000
  - A-OSFI-B10:250d83cc8521:s047:c000
  - A-OSFI-B10:250d83cc8521:s048:c000
  note: ''
- id: G-B10-006
  kind: answerable
  split: dev
  source: A-OSFI-B10
  type: lookup
  difficulty: medium
  question: What does B-10 expect on cloud adoption and cloud portability?
  key_points:
  - Cloud-specific requirements so adoption is planned and consistent with risk appetite, augmenting controls
    on data protection, key management and container management
  - Robust cloud governance to oversee compliance
  - Consider portability when entering a cloud arrangement, weighing benefits, risks and mitigants if
    portability is absent
  - Consider strategies such as multi-cloud design to mitigate provider concentration risk
  pass_rule:
    min_points: 3
    required_points: []
    text: 3 of 4
  supporting_chunks:
  - A-OSFI-B10:250d83cc8521:s059:c000
  - A-OSFI-B10:250d83cc8521:s060:c000
  note: ''

- id: G-E21-001
  kind: answerable
  split: dev
  source: A-OSFI-E21
  type: comparison
  difficulty: medium
  question: What is the difference between risk appetite and tolerance for disruption in E-21?
  key_points:
  - Risk appetite is the types and level of operational risk the institution is willing to accept to achieve
    its business goals
  - Tolerance for disruption is the maximum disruption the institution can withstand in a crisis, under
    severe but plausible scenarios
  - Tolerances for disruption are typically greater than risk appetite (operational risk limits typically
    sit below tolerances)
  pass_rule:
    min_points: 3
    required_points: []
    text: all
  supporting_chunks:
  - A-OSFI-E21:ae9cb76a7e26:s025:c000
  - A-OSFI-E21:ae9cb76a7e26:s015:c000
  note: ''
- id: G-E21-002
  kind: answerable
  split: holdout
  source: A-OSFI-E21
  type: definition
  difficulty: easy
  question: How does E-21 define "critical operations"?
  key_points:
  - Services or products that, if disrupted, would put at risk the institution's continued operations
    or safety and soundness
  - Or would harm other institutions because of its interconnectedness to the financial system
  pass_rule:
    min_points: 2
    required_points: []
    text: all
  supporting_chunks:

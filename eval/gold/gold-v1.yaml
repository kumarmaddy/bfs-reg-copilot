  - A-OSFI-B13:9a80bc98e618:s048:c000
  note: ''
- id: G-B13-005
  kind: answerable
  split: dev
  source: A-OSFI-B13
  type: multi-hop
  difficulty: hard
  question: What should a technology incident management process and a cyber incident taxonomy include
    under B-13?
  key_points:
  - Documented roles and responsibilities, including external parties
  - Early warning indicators or triggers of disruption
  - Classifying incidents by priority and business impact
  - Response procedures with internal and external communication, escalation and notification triggers
  - Periodic testing and exercises, including with third parties
  - A cyber incident taxonomy covering severity, category, type and root cause
  pass_rule:
    min_points: 4
    required_points:
    - 6
    text: 4 of 6, including the taxonomy
  supporting_chunks:
  - A-OSFI-B13:9a80bc98e618:s041:c000
  - A-OSFI-B13:9a80bc98e618:s078:c000
  note: ''
- id: G-STR-001
  kind: answerable
  split: dev
  source: B-FINTRAC-STR
  type: comparison
  difficulty: medium
  question: What threshold triggers a suspicious transaction report, and how does it differ from simple
    suspicion and reasonable grounds to believe?
  key_points:
  - The threshold is reasonable grounds to suspect, a step above simple suspicion (a hunch with no supporting
    facts, context or indicators)
  - Reasonable grounds to believe is higher (verified facts support the probability of an offence) and
    is not required for an STR
  - You do not need to verify the facts or prove that an offence occurred
  pass_rule:
    min_points: 2
    required_points:
    - 1
    - 2
    text: points 1 and 2
  supporting_chunks:
  - B-FINTRAC-STR:077c462d4b5e:s003:c000
  - B-FINTRAC-STR:077c462d4b5e:s003:c001
  note: ''
- id: G-STR-002
  kind: answerable
  split: dev
  source: B-FINTRAC-STR
  type: lookup
  difficulty: easy
  question: When must a suspicious transaction report be submitted, and is there a minimum amount?
  key_points:
  - As soon as practicable after completing the measures that establish reasonable grounds to suspect
  - There is no monetary threshold
  pass_rule:
    min_points: 2
    required_points: []
    text: all
  supporting_chunks:
  - B-FINTRAC-STR:077c462d4b5e:s004:c000
  note: ''
- id: G-STR-003
  kind: answerable
  split: dev
  source: B-FINTRAC-STR
  type: lookup
  difficulty: medium
  question: May a reporting entity tell its client that it has filed an STR?
  key_points:
  - 'No: you may not inform anyone, including the client, of the report''s contents or that you made or
    will make it, if the intent is to prejudice a criminal investigation'
  - This applies whether or not an investigation has begun
  - Do not ask for information you would not normally request during a transaction if that would tip off
    the client
  pass_rule:
    min_points: 2
    required_points:
    - 1
    - 2
    text: points 1 and 2
  supporting_chunks:
  - B-FINTRAC-STR:077c462d4b5e:s002:c000
  note: ''
- id: G-STR-004
  kind: answerable
  split: dev
  source: B-FINTRAC-STR
  type: date / deadline
  difficulty: medium
  question: Can a submitted STR be changed, and by when must the revised report be filed?
  key_points:
  - 'Yes: it can be modified to add missing information or correct it, with an explanation of the change'
  - The revised report must be submitted within 20 days of the date the change was requested
  pass_rule:
    min_points: 2
    required_points: []
    text: all
  supporting_chunks:
  - B-FINTRAC-STR:077c462d4b5e:s012:c000
  note: ''
- id: G-STR-005
  kind: answerable
  split: holdout
  source: B-FINTRAC-STR
  type: lookup
  difficulty: medium
  question: What must a reporting entity do about further suspicious transactions by the same person?
  key_points:
  - Keep reporting the transactions for as long as the suspicion remains
  - Periodically re-assess the client to check the suspicion has not changed
  - May reference the earlier STR in Related Report(s) with the report and transaction reference numbers,
    the original grounds and any new information
  - Detail any new facts, context or indicators in the new reports
  pass_rule:
    min_points: 3
    required_points: []
    text: 3 of 4
  supporting_chunks:
  - B-FINTRAC-STR:077c462d4b5e:s026:c000
  note: ''
- id: G-STR-006
  kind: answerable
  split: dev
  source: B-FINTRAC-STR
  type: lookup
  difficulty: medium
  question: Which common STR deficiencies does FINTRAC list?
  key_points:
  - Using a higher threshold (reasonable grounds to believe) as the basis for reporting
  - Not listing all relevant transactions and accounts in the specified fields (a narrative summary is
    not enough)
  - Leaving out named parties to the transactions (such as conductors, beneficiaries or account holders)
    when that information is available
  - A narrative (Details of suspicion) that does not explain the grounds or link to the transactions
  pass_rule:
    min_points: 3
    required_points: []
    text: 3 of 4
  supporting_chunks:
  - B-FINTRAC-STR:077c462d4b5e:s028:c000
  - B-FINTRAC-STR:077c462d4b5e:s028:c001
  note: ''
- id: G-CPR-001
  kind: answerable
  split: dev
  source: B-FINTRAC-CPR
  type: lookup
  difficulty: easy
  question: Which elements must every reporting entity's compliance program include?
  key_points:
  - A compliance officer who implements the program
  - Written, up-to-date compliance policies and procedures (approved by a senior officer if an entity)
  - A risk assessment of the business
  - A written, ongoing compliance training program
  - A documented training plan
  - A documented plan for, and carrying out of, a two-year effectiveness review
  pass_rule:
    min_points: 5
    required_points: []
    text: 5 of 6
  supporting_chunks:
  - B-FINTRAC-CPR:d0adc27209c2:s001:c000
  note: ''
- id: G-CPR-002
  kind: answerable
  split: dev
  source: B-FINTRAC-CPR
  type: lookup
  difficulty: medium
  question: What must a compliance officer have or understand to implement a compliance program?
  key_points:
  - Authority and access to resources to implement an effective program and make changes
  - Knowledge of the business's functions and structure
  - Knowledge of the sector's money laundering, terrorist financing and sanctions evasion risks, trends
    and typologies
  - Understanding of the sector's requirements under the Act and Regulations
  - Duties may be delegated, but the compliance officer remains responsible
  pass_rule:
    min_points: 3
    required_points: []
    text: 3 of 5
  supporting_chunks:
  - B-FINTRAC-CPR:d0adc27209c2:s002:c000
  - B-FINTRAC-CPR:d0adc27209c2:s002:c001
  note: ''
- id: G-CPR-003
  kind: answerable
  split: dev
  source: B-FINTRAC-CPR
  type: lookup
  difficulty: medium
  question: What must a reporting entity consider when assessing its money laundering, terrorist financing
    and sanctions evasion risks?
  key_points:
  - Clients, business relationships and correspondent banking relationships
  - Products, services and delivery channels
  - Geographic locations of its activities
  - Risks from affiliates, for financial entities, life insurers and securities dealers
  - Risks from new developments or technologies, before they are introduced
  - Risks for its sector in the latest National Risk Assessment
  - Other relevant factors, such as employee turnover or industry rules
  pass_rule:
    min_points: 5
    required_points: []
    text: 5 of 7
  supporting_chunks:
  - B-FINTRAC-CPR:d0adc27209c2:s004:c000
  note: B-FINTRAC-RBA s007 and s005 list similar areas.
- id: G-CPR-004
  kind: answerable
  split: dev
  source: B-FINTRAC-CPR
  type: date / deadline
  difficulty: medium
  question: How often must the compliance program effectiveness review happen, and to whom must an entity
    report the results?
  key_points:
  - At least every two years; the next review must start no later than 24 months after the start of the
    previous one
  - The previous review must be finished before the next starts
  - An entity reports in writing to a senior officer no later than 30 days after completion
  - The report covers findings, policy updates made outside the review, and the status of implementing
    updates
  pass_rule:
    min_points: 3
    required_points:
    - 3
    text: 3 of 4, including the 30 days
  supporting_chunks:
  - B-FINTRAC-CPR:d0adc27209c2:s011:c000
  - B-FINTRAC-CPR:d0adc27209c2:s011:c001
  - B-FINTRAC-CPR:d0adc27209c2:s011:c003
  note: B-FINTRAC-RBA s030 also states the two-year minimum.
- id: G-CPR-005
  kind: answerable
  split: holdout
  source: B-FINTRAC-CPR
  type: lookup
  difficulty: medium
  question: What must a reporting entity's policies for enhanced measures include?
  key_points:
  - Written policies for risks the entity identifies as high
  - Additional steps, based on the risk, to verify identity
  - Additional mitigation steps, such as updating client identification and beneficial ownership information,
    and ongoing monitoring, at a frequency suited to the risk
  - 'Examples: more client information, source of funds or wealth, reasons for transactions'
  pass_rule:
    min_points: 3
    required_points: []
    text: 3 of 4
  supporting_chunks:
  - B-FINTRAC-CPR:d0adc27209c2:s005:c000
  note: ''
- id: G-RBA-001

- id: G-E21-005
  kind: answerable
  split: dev
  source: A-OSFI-E21
  type: multi-hop
  difficulty: hard
  question: Which key areas does E-21 say strengthen operational resilience, and which other OSFI guidelines
    does it point to for technology, cyber and third-party risk?
  key_points:
  - 'Seven areas: business continuity, disaster recovery, crisis management, change management, technology
    and cyber, third-party risk, data risk'
  - Technology and cyber risk (and disaster recovery, information classification and data protection)
    refer to Guideline B-13
  - Third-party risk refers to Guideline B-10
  pass_rule:
    min_points: 3
    required_points:
    - 1
    - 2

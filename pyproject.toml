[project]
name = "bfs-reg-copilot"
version = "0.0.1"
description = "Governed RAG assistant for Canadian and US financial-regulation research (portfolio project, public data only)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Kumar Maddipatla" }]
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
]

[project.scripts]
reg-register = "bfs_reg_copilot.registry.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pip-audit",
    "pre-commit>=4.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bfs_reg_copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes, I: imports, B: bugbear, UP: pyupgrade, S: bandit (security),
# SIM: simplify, C4: comprehensions, PT: pytest style, RUF: ruff-specific
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are the point of tests

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
